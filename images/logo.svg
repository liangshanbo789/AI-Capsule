<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- 浅色背景下高奢石墨与微渐变 -->
    <linearGradient id="capsule-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="capsule-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.05"/>
    </linearGradient>
    <!-- 精致漫反射投影 -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- 极简高精轨道微环 -->
  <ellipse cx="100" cy="100" rx="76" ry="26" transform="rotate(-30, 100, 100)" fill="none" stroke="url(#ring-grad)" stroke-width="2.5" stroke-dasharray="6 8 16 8"/>

  <!-- 胶囊主体，整体倾斜 -45 度，附带柔和高级投影 -->
  <g transform="rotate(-45, 100, 100)" filter="url(#soft-shadow)">
    <!-- 胶囊左侧：石墨黑 -->
    <path d="M 72 78 A 22 22 0 0 0 72 122 L 100 122 L 100 78 Z" fill="url(#capsule-left)" />
    <!-- 胶囊右侧：科技深蓝 -->
    <path d="M 100 78 L 128 78 A 22 22 0 0 1 128 122 L 100 122 Z" fill="url(#capsule-right)" />
    <!-- 胶囊中心精密分割线 -->
    <line x1="100" y1="78" x2="100" y2="122" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <!-- 高端微弧光泽高光 -->
    <path d="M 74 84 Q 100 84 126 84" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.45" stroke-linecap="round"/>
  </g>

  <!-- 瑞士极简智核四角星（右上星标） -->
  <path d="M 152 54 Q 152 68 166 68 Q 152 68 152 82 Q 152 68 138 68 Q 152 68 152 54 Z" fill="#2563eb" />

  <!-- 灵动微星（左下小点） -->
  <circle cx="46" cy="132" r="3.5" fill="#0f172a" opacity="0.5" />
</svg>
