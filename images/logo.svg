<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- 定义渐变和阴影滤镜 -->
  <defs>
    <!-- 左半胶囊渐变：幻彩紫到极光蓝 -->
    <linearGradient id="capsule-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <!-- 右半胶囊渐变：粉红到紫红 -->
    <linearGradient id="capsule-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <!-- 四角星渐变 -->
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <!-- 胶囊外环发光渐变 -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>
    <!-- 霓虹发光滤镜 -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 发光轨道环 -->
  <ellipse cx="100" cy="100" rx="75" ry="25" transform="rotate(-30, 100, 100)" fill="none" stroke="url(#ring-grad)" stroke-width="4" filter="url(#neon-glow)" stroke-dasharray="10 15 30 15"/>

  <!-- 胶囊主体，整体倾斜 -45 度 -->
  <g transform="rotate(-45, 100, 100)">
    <!-- 胶囊左侧 -->
    <path d="M 75 80 A 20 20 0 0 0 75 120 L 100 120 L 100 80 Z" fill="url(#capsule-left)" />
    <!-- 胶囊右侧 -->
    <path d="M 100 80 L 125 80 A 20 20 0 0 1 125 120 L 100 120 Z" fill="url(#capsule-right)" />
    <!-- 胶囊中间的分界线 -->
    <line x1="100" y1="80" x2="100" y2="120" stroke="#0e131f" stroke-width="2" opacity="0.4"/>
    <!-- 亮光反射条 -->
    <path d="M 75 85 Q 100 85 125 85" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- AI 四角星（右上大） -->
  <path d="M 155 55 Q 155 70 170 70 Q 155 70 155 85 Q 155 70 140 70 Q 155 70 155 55 Z" fill="url(#sparkle-grad)" filter="url(#neon-glow)" />

  <!-- AI 四角星（左下小） -->
  <path d="M 45 125 Q 45 133 53 133 Q 45 133 45 141 Q 45 133 37 133 Q 45 133 45 125 Z" fill="#06b6d4" opacity="0.8" />
</svg>
